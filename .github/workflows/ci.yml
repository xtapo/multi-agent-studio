name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes an in-flight run cancels it: nobody needs the results
# of a commit that is already two commits old.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Build-time env only. No database is contacted: `prisma generate` reads the
    # schema file, and `next build` only needs env.ts validation to pass.
    env:
      DATABASE_URL: postgresql://mas:mas@localhost:5432/multi_agent_studio?schema=public
      AUTH_SECRET: ci-only-secret-not-used-anywhere
      AUTH_URL: http://localhost:3000
      ENCRYPTION_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      OPENAI_API_KEY: sk-ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx next build
